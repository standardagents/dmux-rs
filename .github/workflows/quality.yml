name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install tmux
        run: brew install tmux
      - name: Validate (quality + rendering fidelity)
        run: scripts/validate.sh
